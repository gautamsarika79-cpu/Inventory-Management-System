<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock History · Trackify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell" style="flex-direction:column">
    <div id="topbar" class="topbar"></div>
    <div class="body-wrap">
      <div id="sidebar" class="sidebar"></div>
      <div class="main">
        <div class="page-header">
          <h2>Stock Movement History <span class="count-pill" id="resultCount"></span></h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Reason</th><th>Recorded By</th></tr></thead>
            <tbody id="movementsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
  renderShell('movements');
  renderSidebarCategories();

  async function loadMovements() {
    try {
      const { movements, count } = await api('/stock-movements');
      document.getElementById('resultCount').textContent = count;
      document.getElementById('movementsBody').innerHTML = movements.length
        ? movements.map((m) => `
          <tr>
            <td>${new Date(m.date).toLocaleString()}</td>
            <td><a href="product.html?id=${m.productId}" style="color:var(--gold)">${m.productName}</a></td>
            <td><span class="badge ${m.type}">${m.type === 'in' ? 'STOCK IN' : 'STOCK OUT'}</span></td>
            <td>${m.quantity}</td>
            <td>${m.reason}</td>
            <td>${m.userName}</td>
          </tr>`).join('')
        : `<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:24px">No movements recorded yet.</td></tr>`;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadMovements();
</script>
</body>
</html>
