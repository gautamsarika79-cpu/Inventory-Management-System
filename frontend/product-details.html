<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | Trackify</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="products.html">📦 Trackify</a><div class="top-actions"><button class="ghost" onclick="location.href='products.html'">← Products</button><button id="logoutBtn" class="ghost">Logout</button></div></header><main class="container"><div id="details" class="details-card">Loading product...</div></main><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('details');try{const p=await apiRequest('/products/'+id);const src=p.image?API_BASE.replace('/api','')+'/uploads/'+encodeURIComponent(p.image):'';box.innerHTML=`<div class="detail-image">${src?`<img src="${src}" alt="${escapeHTML(p.name)}">`:'📦'}</div><div class="detail-info"><span class="category-label">${escapeHTML(p.category)}</span><h1>${escapeHTML(p.name)}</h1><p class="detail-price">${formatCurrency(p.price)}</p><p>Stock: <strong>${Number(p.quantity)}</strong> units</p><button class="primary" onclick="location.href='products.html'">Back to Products</button></div>`}catch(e){box.innerHTML='<p class="error">'+escapeHTML(e.message)+'</p>'}});</script></body></html>
