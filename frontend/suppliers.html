<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suppliers · Trackify</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell" style="flex-direction:column">
    <div id="topbar" class="topbar"></div>
    <div class="body-wrap">
      <div id="sidebar" class="sidebar"></div>
      <div class="main">
        <div class="page-header">
          <h2>Suppliers <span class="count-pill" id="resultCount"></span></h2>
          <button class="btn btn-primary" id="openAddBtn">+ Add Supplier</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Country</th><th>Products</th><th></th></tr></thead>
            <tbody id="suppliersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="supplierModal">
    <div class="modal">
      <span class="modal-close" id="closeModal">&times;</span>
      <h3 id="modalTitle">Add Supplier</h3>
      <form id="supplierForm">
        <input type="hidden" id="supplierId" />
        <div class="field"><label>Company Name</label><input type="text" id="fName" required /></div>
        <div class="form-row">
          <div class="field"><label>Contact Person</label><input type="text" id="fContact" /></div>
          <div class="field"><label>Country</label><input type="text" id="fCountry" /></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Email</label><input type="email" id="fEmail" /></div>
          <div class="field"><label>Phone</label><input type="text" id="fPhone" /></div>
        </div>
        <div class="field"><label>Address</label><input type="text" id="fAddress" /></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelModal" style="flex:1">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
  renderShell('suppliers');
  renderSidebarCategories();
  const user = getUser();

  document.getElementById('openAddBtn').addEventListener('click', () => openModal());
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelModal').addEventListener('click', closeModal);

  async function loadSuppliers() {
    try {
      const { suppliers, count } = await api('/suppliers');
      document.getElementById('resultCount').textContent = count;
      document.getElementById('suppliersBody').innerHTML = suppliers.length
        ? suppliers.map((s) => `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td>${s.contactPerson || '—'}</td>
            <td>${s.email || '—'}</td>
            <td>${s.phone || '—'}</td>
            <td>${s.country || '—'}</td>
            <td>${s.productCount}</td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick='editSupplier(${s.id})'>Edit</button>
              ${user?.role === 'admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteSupplier(${s.id}, '${s.name.replace(/'/g, "\\'")}')">Del</button>` : ''}
            </td>
          </tr>`).join('')
        : `<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px">No suppliers yet.</td></tr>`;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function openModal(s) {
    document.getElementById('modalTitle').textContent = s ? 'Edit Supplier' : 'Add Supplier';
    document.getElementById('supplierId').value = s?.id || '';
    document.getElementById('fName').value = s?.name || '';
    document.getElementById('fContact').value = s?.contactPerson || '';
    document.getElementById('fCountry').value = s?.country || '';
    document.getElementById('fEmail').value = s?.email || '';
    document.getElementById('fPhone').value = s?.phone || '';
    document.getElementById('fAddress').value = s?.address || '';
    document.getElementById('supplierModal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('supplierModal').classList.remove('show');
    document.getElementById('supplierForm').reset();
  }

  async function editSupplier(id) {
    try {
      const { supplier } = await api(`/suppliers/${id}`);
      openModal(supplier);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function deleteSupplier(id, name) {
    if (!confirm(`Delete supplier "${name}"?`)) return;
    try {
      await api(`/suppliers/${id}`, { method: 'DELETE' });
      showToast('Supplier deleted.');
      loadSuppliers();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.getElementById('supplierForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('supplierId').value;
    const payload = {
      name: document.getElementById('fName').value.trim(),
      contactPerson: document.getElementById('fContact').value.trim(),
      country: document.getElementById('fCountry').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      address: document.getElementById('fAddress').value.trim(),
    };
    try {
      if (id) {
        await api(`/suppliers/${id}`, { method: 'PUT', body: payload });
        showToast('Supplier updated.');
      } else {
        await api('/suppliers', { method: 'POST', body: payload });
        showToast('Supplier added.');
      }
      closeModal();
      loadSuppliers();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });

  loadSuppliers();
</script>
</body>
</html>
