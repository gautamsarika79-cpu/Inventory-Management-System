<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Web Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="fa-solid fa-boxes-stacked text-primary me-2"></i>Inventory Management System</a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#supplierModal">
          + Add Supplier
        </button>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#productModal">
          + Add Product
        </button>
        <button class="btn btn-outline-danger btn-sm ms-2" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    
    <!-- Top Dashboard Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="kpi-card p-3">
          <div class="kpi-title">Total Inventory Value</div>
          <div id="kpiTotalValue" class="kpi-value mt-1">$0.00</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card p-3">
          <div class="kpi-title text-danger">Low Stock Alerts (&lt; 5 Items)</div>
          <div id="kpiLowStock" class="kpi-value mt-1 text-danger">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card p-3">
          <div class="kpi-title">Total Products</div>
          <div id="kpiTotalProducts" class="kpi-value mt-1">0</div>
        </div>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="card-table mb-4">
      <div class="p-3 bg-white border-bottom">
        <div class="row g-2">
          <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search products by name..." oninput="fetchProducts()" />
          </div>
          <div class="col-md-6">
            <select id="supplierFilter" class="form-select" onchange="fetchProducts()">
              <option value="">Filter by Supplier (All)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Image</th>
              <th>Product Name</th>
              <th>Supplier</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Modal: Add Product -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="productForm" onsubmit="handleProductSubmit(event)" enctype="multipart/form-data">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Product Name *</label>
              <input type="text" id="prodName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="prodDescription" class="form-control" rows="2"></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label fw-semibold">Price ($) *</label>
                <input type="number" id="prodPrice" class="form-control" min="0" step="0.01" required />
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold">Quantity *</label>
                <input type="number" id="prodQuantity" class="form-control" min="0" step="1" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Supplier *</label>
              <select id="prodSupplier" class="form-select" required>
                <option value="">Select Supplier</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Image Upload *</label>
              <input type="file" id="prodImage" class="form-control" accept="image/*" required />
            </div>
            <div id="productError" class="alert alert-danger d-none" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Add Supplier -->
  <div class="modal fade" id="supplierModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Supplier</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="supplierForm" onsubmit="handleSupplierSubmit(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Supplier Name *</label>
              <input type="text" id="suppName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Contact Email *</label>
              <input type="email" id="suppEmail" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Phone *</label>
              <input type="text" id="suppPhone" class="form-control" required />
            </div>
            <div id="supplierError" class="alert alert-danger d-none" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Supplier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: View Product Details -->
  <div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <img id="viewImage" src="" alt="Product" class="rounded mb-3 mx-auto" style="max-height: 180px; object-fit: contain;" />
        <h4 id="viewName" class="fw-bold"></h4>
        <p id="viewDescription" class="text-muted small"></p>
        <ul class="list-group list-group-flush text-start w-100">
          <li class="list-group-item"><strong>Price:</strong> <span id="viewPrice"></span></li>
          <li class="list-group-item"><strong>Stock Quantity:</strong> <span id="viewQuantity"></span></li>
          <li class="list-group-item"><strong>Supplier:</strong> <span id="viewSupplier"></span></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
