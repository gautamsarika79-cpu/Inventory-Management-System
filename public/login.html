<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="d-flex align-items-center justify-content-center bg-light">

  <div class="card shadow-sm p-4 border-0" style="max-width: 420px; width: 100%; border-radius: 16px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-indigo m-0"><i class="fa-solid fa-boxes-stacked text-primary me-2"></i>Inventory Management System</h3>
      <p class="text-muted small">Web-Based Portal</p>
    </div>
    
    <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Admin username" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Sign In</button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/index.html';
        } else {
          errorDiv.textContent = data.error;
          errorDiv.classList.remove('d-none');
        }
      } catch (err) {
        errorDiv.textContent = 'Login failed. Please try again.';
        errorDiv.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
